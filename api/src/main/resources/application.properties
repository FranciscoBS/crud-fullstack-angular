# Nombre de la aplicación usado por Spring Boot
spring.application.name=crud-fullstack-angular

# Nota: reemplaza los valores siguientes con los de tu servidor SQL Server
# URL de conexión JDBC a SQL Server (host:puerto;databaseName=NombreBD;opciones)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=attendance;encrypt=true;trustServerCertificate=true

# Usuario para conectar a la base de datos (Autenticación SQL Server)
spring.datasource.username=sa

# Contraseña del usuario de la base de datos
spring.datasource.password=admin

# Clase del driver JDBC de Microsoft SQL Server
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuraciones JPA / Hibernate
# Estrategia DDL: 'update' aplica cambios de esquema automáticamente en desarrollo
spring.jpa.hibernate.ddl-auto=update

# Mostrar las sentencias SQL en los logs (true/false)
spring.jpa.show-sql=true

# Dialecto de Hibernate optimizado para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Formatear las consultas SQL en los logs para mejor lectura
spring.jpa.properties.hibernate.format_sql=true
